[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-handbook"
version = "0.2.0"
description = "Offline technology discovery and evidence-backed pipeline onboarding"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
pipeline-handbook = "pipeline_handbook.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline_handbook*"]

[tool.setuptools.package-data]
pipeline_handbook = ["data/*.json"]
